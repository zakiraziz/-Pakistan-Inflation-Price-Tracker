[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = [
    # CLI entrypoints & dev/verification scripts (integration- or manually-tested)
    "tests/*", "shot.py", "scheduler.py", "test_pipeline.py", "test_web.py",
    "seed.py", "job.py", "analyze.py",
    "diagnose.py", "inventory.py", "compute_coverage.py", "gen.py",
    "run_smoke.py", "run_verify.py", "verify.py", "write_verify.py",
]   # CLI entrypoints are integration-tested

[tool.coverage.report]
show_missing = true
# target: 80%+ (see README "Checking it works")

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]   # long lines are formatted by black

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["db.py", "validators.py", "model.py", "alert.py", "ingest/"]